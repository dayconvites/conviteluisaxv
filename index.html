<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Convite Luisa XV</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #132540;
    }

    body { overflow-x: hidden; }

    .envelope {
      position: relative;
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      line-height: 0;
      transition: transform 0.4s ease, opacity 0.4s ease, filter 0.4s ease;
    }

    .envelope img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    .abrir {
      position: absolute;
      left: 31%;
      top: 39%;
      width: 38%;
      height: 23%;
      display: block;
      z-index: 10;
      border-radius: 50%;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope.abrindo {
      transform: scale(1.08);
      opacity: 0;
      filter: blur(3px);
    }

    .transicao {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .transicao.ativa { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .envelope, .transicao { transition: none; }
    }
  </style>
</head>
<body>
  <main class="envelope" id="envelope">
    <img src="ENVELOPE.png" alt="Envelope do convite de 15 anos da Luisa">
    <a class="abrir" href="convite/" id="abrirConvite" aria-label="Abrir convite"></a>
  </main>

  <div class="transicao" id="transicao"></div>

  <script>
    const botao = document.getElementById("abrirConvite");
    const envelope = document.getElementById("envelope");
    const transicao = document.getElementById("transicao");

    botao.addEventListener("click", function(event) {
      event.preventDefault();
      envelope.classList.add("abrindo");
      transicao.classList.add("ativa");

      setTimeout(function() {
        window.location.href = "convite/";
      }, 400);
    });
  </script>
</body>
</html>
