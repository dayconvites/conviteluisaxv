<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Convite Luisa XV</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #001b4d;
    }

    .envelope {
      position: relative;

      /* Preenche a largura no celular */
      width: 100%;

      /* Evita ficar exageradamente grande no computador */
      max-width: 700px;

      margin: 0 auto;
      line-height: 0;
    }

    .envelope img {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
       Área clicável sobre o selo e
       "CLIQUE AQUI PARA ABRIR"
    */
    .abrir {
      position: absolute;

      left: 31%;
      top: 39%;

      width: 38%;
      height: 23%;

      display: block;
      z-index: 10;

      border-radius: 50%;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    /*
       Pequeno efeito ao tocar/clicar
    */
    .abrir:active {
      transform: scale(0.97);
    }

  </style>

</head>

<body>

  <main class="envelope">

    <img
      src="ENVELOPE.png"
      alt="Envelope do convite de 15 anos da Luisa"
    >

    <!-- Clique no selo para abrir o convite -->

    <a
      class="abrir"
      href="convite/"
      aria-label="Abrir convite"
    ></a>

  </main>

</body>

</html>
